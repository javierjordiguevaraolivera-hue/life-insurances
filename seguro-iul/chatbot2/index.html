  <script>
    let pendingDisqualification = null;
    let currentStep = 0;
    const chatMessages = document.getElementById('chatMessages');
    const waStatus = document.getElementById('waStatus');

    const disqualifyURL = '/seguro-iul/no-califica.html';
    const disqualify_confirm_message = false;
    const conversation = [
      {
        "text": "Hola 👋",
        "delay": 1000
      },
      {
        "text": "Soy María del Programa de Ahorro con Seguros IUL con Beneficios en Vida.",
        "delay": 1000
      },
      {
        "text": "Miles de familias están aplicando a un Seguro IUL 💵 que protege a los tuyos 👨‍👩‍👧 y acumula un ahorro en vida 📈 que puedes usar para tu retiro, tu salud o cualquier emergencia.",
        "delay": 1000
      },
      {
        "text": "Déjame hacerte unas preguntas rápidas para ver si calificas 😊",
        "delay": 1000
      },
      {
        "text": "Selecciona tu rango de edad:",
        "delay": 1000,
        "options": [
          "18 a 39",
          "40 a 54",
          "55 a 65+"
        ],
        "disqualifyAnswers": [
          "55 a 65+"
        ]
      },
      {
        "text": "¡Muy bien! 😄",
        "delay": 1000
      },
      {
        "text": "¿Has recibido algún beneficio del IUL en los últimos 2 años?",
        "delay": 1000,
        "options": [
          "Sí",
          "No"
        ]
      },
      {
        "text": "Perfecto! 😊 Una última pregunta.",
        "delay": 1000
      },
      {
        "text": "¿Cómo está tu salud? 💪",
        "delay": 1000,
        "options": [
          "Estoy saludable",
          "Tengo algunas condiciones"
        ]
      },
      {
        "text": "🎉 ¡Felicidades! Estás Precalificado para un Seguro IUL con Beneficios en Vida. 🙌",
        "delay": 1000
      },
      {
        "text": "Hemos reservado un especialista para ayudarte a asegurar tu cobertura y comenzar tu plan de ahorro hoy mismo. 😃",
        "delay": 1000
      },
      {
        "text": "Haz clic en el botón para llamar 📞 antes de que expire tu precalificación.",
        "delay": 1000
      },
      {
        "text": "Precalificación reservada por: 1 minuto ⏱️ ¡Llámanos ahora!",
        "delay": 1000,
        "callButton": true,
        "buttonText": "(786) 204-2371",
        "buttonLink": "tel:+17862042371"
      }
    ];

    function dlPush(ev) { try { (window.dataLayer = window.dataLayer || []).push({ event: ev }); } catch (e) {} }
    dlPush('pageview');
    document.addEventListener('click', function (e) {
      if (e.target && e.target.closest && e.target.closest('a[href^="tel:"]')) dlPush('contact');
    });

    const headerCall = document.getElementById('header-call');
    if (headerCall) {
      headerCall.addEventListener('click', function () {
        const pool = document.getElementById('pool-num');
        if (pool && pool.getAttribute('href')) this.href = pool.getAttribute('href');
      });
    }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(function () {});
      }
    }
    document.addEventListener('pointerdown', initAudio);
    document.addEventListener('touchstart', initAudio);
    document.addEventListener('click', initAudio);

    function playPop() {
      try {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(830, t);
        o.frequency.setValueAtTime(1244, t + 0.07);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(t);
        o.stop(t + 0.25);
      } catch (e) {}
    }

    function nowTime() {
      try {
        return new Date().toLocaleTimeString('es-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase();
      } catch (e) {
        var d = new Date();
        return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
      }
    }

    function scrollChat() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addTypingIndicator() {
      waStatus.textContent = 'escribiendo...';
      const wrap = document.createElement('div');
      wrap.classList.add('msg', 'in', 'wa-typing');
      wrap.innerHTML = '<div class="bubble"><span class="typing-dots"><i></i><i></i><i></i></span></div>';
      chatMessages.appendChild(wrap);
      scrollChat();
      return wrap;
    }

    function removeTypingIndicator(indicator) {
      waStatus.textContent = 'en línea';
      if (indicator && indicator.parentElement) {
        indicator.remove();
      }
    }

    function addMessage(text, isUser = false) {
      const wrap = document.createElement('div');
      wrap.classList.add('msg', isUser ? 'out' : 'in');

      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      bubble.innerHTML = text;

      const meta = document.createElement('span');
      meta.classList.add('meta');
      meta.innerHTML = isUser
        ? nowTime() + ' <svg viewBox="0 0 18 12"><path d="M6.4 10.9 2.1 6.6l1.2-1.2 3.1 3.1L13 1.9l1.2 1.2-7.8 7.8z"/><path d="M10.9 10.9 9.8 9.8l1.2-1.2 1.1 1.1 6-6 1.2 1.2-7.4 6z" transform="translate(-2.4 0)"/></svg>'
        : nowTime();
      bubble.appendChild(meta);

      wrap.appendChild(bubble);
      chatMessages.appendChild(wrap);
      scrollChat();
      if (!isUser) playPop();
    }

    function addOptions(options) {
      const wrap = document.createElement('div');
      wrap.classList.add('wa-options');
      options.forEach(option => {
        const button = document.createElement('button');
        button.classList.add('wa-option');
        button.textContent = option;
        button.onclick = () => handleUserInput(option);
        wrap.appendChild(button);
      });
      chatMessages.appendChild(wrap);
      scrollChat();
    }

    function addCallButton() {
      const link = document.createElement('a');
      link.classList.add('wa-call');

      const poolEl = document.getElementById('pool-num');
      const poolText = poolEl && poolEl.textContent.trim() ? poolEl.textContent.trim() : null;
      const poolHref = poolEl && poolEl.getAttribute('href') ? poolEl.getAttribute('href') : null;

      link.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.24.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>';

      const t = document.createElement('span');
      t.classList.add('t');
      const num = document.createElement('span');
      num.classList.add('num');
      num.textContent = poolText || conversation[currentStep].buttonText;
      const sub = document.createElement('span');
      sub.classList.add('sub');
      sub.textContent = '🔒100% Seguro. Llamada 100% Gratis';
      t.appendChild(num);
      t.appendChild(sub);
      link.appendChild(t);

      link.href = poolHref || conversation[currentStep].buttonLink;

      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        link.href = link.href.replace('tel:', 'tel://');
      }

      chatMessages.appendChild(link);
      scrollChat();
    }

    function handleDisqualificationConfirmation(confirmResponse) {
      if (confirmResponse === "Yes") {
        window.location.href = disqualifyURL;
      } else {
        currentStep++;
        processConversation();
      }
      pendingDisqualification = null;
    }

    function handleUserInput(input) {
      addMessage(input, true);
      dlPush('view_content');
      const opts = chatMessages.querySelector('.wa-options');
      if (opts) {
        opts.remove();
      }

      if (pendingDisqualification) {
        handleDisqualificationConfirmation(input);
        return;
      }

      const currentConversation = conversation[currentStep];
      if (currentConversation.disqualifyAnswers &&
          currentConversation.disqualifyAnswers.includes(input)) {

        if (disqualify_confirm_message) {
          pendingDisqualification = input;
          const typingIndicator = addTypingIndicator();
          setTimeout(() => {
            removeTypingIndicator(typingIndicator);
            addMessage("Are you sure you selected the right answer?");
            addOptions(["Yes", "No"]);
          }, 500);
        } else {
          window.location.href = disqualifyURL;
        }
        return;
      }

      currentStep++;
      processConversation();
    }

    function processConversation() {
      if (currentStep < conversation.length) {
        const step = conversation[currentStep];
        const typingIndicator = addTypingIndicator();

        setTimeout(() => {
          removeTypingIndicator(typingIndicator);
          addMessage(step.text);
          if (step.options) {
            addOptions(step.options);
          } else if (step.callButton) {
            addCallButton();
          } else {
            currentStep++;
            processConversation();
          }
        }, step.delay);
      }
    }

    processConversation();
  </script>

  <script>
    const fallbackNames = [
      "James Carter", "Sophia Martinez", "Liam Johnson", "Olivia Smith",
      "Ethan Davis", "Emma Brown", "Noah Garcia", "Ava White",
      "William Martinez", "Isabella Anderson", "Michael Moore", "Charlotte Taylor",
      "Benjamin Clark", "Amelia Walker", "Elijah Wright", "Mia Thompson",
      "Alexander Hill", "Harper Scott", "Daniel Adams", "Evelyn Lewis"
    ];
    const fallbackStates = [
      "California", "Texas", "New York", "Florida", "Illinois",
      "Pennsylvania", "Ohio", "Georgia", "North Carolina", "Michigan"
    ];
    const fallbackImg = "/seguro-iul/chatbot1/imagenes/notificacion.svg";

    let people = [];
    fetch('https://randomuser.me/api/?results=25&nat=us&inc=name,picture,location&noinfo')
      .then(r => r.json())
      .then(d => {
        people = (d.results || []).map(u => ({
          name: `${u.name.first} ${u.name.last}`,
          state: (u.location && u.location.state) || fallbackStates[Math.floor(Math.random() * fallbackStates.length)],
          img: u.picture.medium
        }));
      })
      .catch(() => {});

    function getRandomQuote() {
      return `$${Math.floor(Math.random() * (65 - 50 + 1) + 50)} per week`;
    }

    function showNotification() {
      let person;
      if (people.length) {
        person = people[Math.floor(Math.random() * people.length)];
      } else {
        person = {
          name: fallbackNames[Math.floor(Math.random() * fallbackNames.length)],
          state: fallbackStates[Math.floor(Math.random() * fallbackStates.length)],
          img: fallbackImg
        };
      }

      const nameText = document.getElementById("name-text");
      const quoteText = document.getElementById("quote-text");
      const stateImg = document.getElementById("state-img");

      nameText.textContent = `${person.name} From ${person.state}`;
      quoteText.textContent = `${person.name} just got approved for ${getRandomQuote()}!`;
      stateImg.onerror = function () { this.onerror = null; this.src = fallbackImg; };
      stateImg.src = person.img;

      const notification = document.getElementById("notification-container");
      notification.classList.add("show");

      setTimeout(() => {
        notification.classList.remove("show");
      }, 4000);
    }

    function startNotifications() {
      showNotification();
      setInterval(() => {
        showNotification();
      }, 8000);
    }

    setTimeout(startNotifications, 2500);
  </script>

</body>
